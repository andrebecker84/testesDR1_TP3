# Test Application Configuration
spring.application.name=tp3-selenium-tests-test

# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled in tests)
spring.h2.console.enabled=false

# Logging Configuration for Tests
logging.level.root=WARN
logging.level.br.edu.infnet.tp3=INFO

# Selenium Test Configuration
selenium.browser=chrome
selenium.headless=true
selenium.timeout=15
selenium.screenshot.path=target/test-screenshots
selenium.implicit.wait=5
